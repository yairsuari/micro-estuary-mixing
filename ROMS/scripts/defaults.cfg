# Default run parameters for ROMS/scripts/run_one.sh (KEY=VALUE, one per line).
# Any key can be overridden per run on the command line or in an experiment cfg.
# DT and NDTFAST default to the values suggested in ROMS/Data/<domain>/summary.json.

# input folder under ROMS/ (Data_N14 etc. for other vertical resolutions)
DATA=Data
# initial conditions in the input folder: ini.nc = day 1 of a static run from the prescribed fields
# (ROMS/python/ini_from_run.py, no spin-up needed); ini_raw.nc = the prescribed fields (roms_ini.py)
INI_FILE=ini.nc

# executable in $ROMS_BIN (default ~/roms/bin), built by ROMS/Apps/estuary/build_roms.sh
EXEC=micro_estuary_my25_serial_dyes   # with the passive tracers (NPT=6); micro_estuary_my25_serial needs NPT=0
NPROC=1
NTILEI=1
NTILEJ=1

# run length and output intervals
DAYS=10
HIS_HOURS=1
AVG_HOURS=1
DIA_HOURS=1
RST_DAYS=1
INFO_MINUTES=10

# physics
AKT_BAK=3.162e-7        # background diffusivity, temperature (m2/s); starting value, calibrated in E1
AKS_BAK=3.162e-7        # background diffusivity, salinity (m2/s)
AKV_BAK=3.162e-7        # background viscosity (m2/s)
TNU2=0                  # horizontal tracer diffusivity (m2/s): 0
VISC2=0.1               # horizontal viscosity (m2/s)
ZOB=0.01                # bottom roughness (m)
DCRIT=0.05              # wet/dry critical depth (m), POM hc

# sea boundary: tracer nudging on inflow (days) and outflow/inflow ratio
TNUDG=0.0417
OBCFAC=10.0

# river point sources (rivers.nc): off in the static run
RIVERS=off
RIVER_SCALE=1           # multiplies the rivers.nc transport (flow experiments x0.25 ... x4)

# wind: none (zero stress, ANA_SMFLUX). WIND_FILE=<file in the input folder> (ROMS/python/roms_wind.py)
# copies it to the run folder as wind.nc; it needs an executable built with --cpp -DUSE_WIND_FILE
WIND_FILE=none

NPT=6                   # passive tracers: river water, seawater, ventilation age (3 mean-age pairs)
TIME_REF=20000101.0d0
