# E4a (wind variability) and the reduced E1 (base-flow mixing) on the closed mouth (Data_bar: two 2 m sea
# cells, the crest 0.10 m above sea level, the unchanged estuary), from the filled estuary (ini.nc of
# experiments/ini_fill.cfg). Same design as wind_iw.cfg + wind_iw_shapes.cfg: constant and diurnal wind of
# the same mean |stress|, median M = 1, 2, 4, 6, 8 m/s, and no wind; Alexander from 270 deg, Meander and
# NoMeander from 231 deg (diurnal: 231 then 51). River 20 000 m3/day, sea level 0, 30 days, hourly history,
# AKS = AKT = 1e-8, AKV = 1e-6.
# E1 (base flow, Alexander, the E4a settings): river + constant 2 m/s = const_2, river only = none; and
#   e1_static (no river, no wind), e1_wind (wind only), e1_aks1e7 / e1_aks1e6 (river + wind, AKS = AKT = 1e-7 / 1e-6).
EXPERIMENT=wind_iw_bar
PARALLEL=13
COMMON DATA=Data_bar DAYS=30 HIS_HOURS=1 AVG_HOURS=24 DIA_HOURS=24 RIVERS=on AKS_BAK=1e-8 AKT_BAK=1e-8 AKV_BAK=1e-6 EXEC=micro_estuary_my25_serial_dyes_wind

const_8                Alexander  WIND_FILE=wind_c8.nc
diurnal_8              Alexander  WIND_FILE=wind_d8.nc
meander_const_8        Meander    WIND_FILE=wind_c8_from231.nc
meander_diurnal_8      Meander    WIND_FILE=wind_d8_from231.nc
nomeander_const_8      NoMeander  WIND_FILE=wind_c8_from231.nc
nomeander_diurnal_8    NoMeander  WIND_FILE=wind_d8_from231.nc
const_6                Alexander  WIND_FILE=wind_c6.nc
diurnal_6              Alexander  WIND_FILE=wind_d6.nc
meander_const_6        Meander    WIND_FILE=wind_c6_from231.nc
meander_diurnal_6      Meander    WIND_FILE=wind_d6_from231.nc
nomeander_const_6      NoMeander  WIND_FILE=wind_c6_from231.nc
nomeander_diurnal_6    NoMeander  WIND_FILE=wind_d6_from231.nc
const_4                Alexander  WIND_FILE=wind_c4.nc
diurnal_4              Alexander  WIND_FILE=wind_d4.nc
meander_const_4        Meander    WIND_FILE=wind_c4_from231.nc
meander_diurnal_4      Meander    WIND_FILE=wind_d4_from231.nc
nomeander_const_4      NoMeander  WIND_FILE=wind_c4_from231.nc
nomeander_diurnal_4    NoMeander  WIND_FILE=wind_d4_from231.nc
const_2                Alexander  WIND_FILE=wind_c2.nc
diurnal_2              Alexander  WIND_FILE=wind_d2.nc
meander_const_2        Meander    WIND_FILE=wind_c2_from231.nc
meander_diurnal_2      Meander    WIND_FILE=wind_d2_from231.nc
nomeander_const_2      NoMeander  WIND_FILE=wind_c2_from231.nc
nomeander_diurnal_2    NoMeander  WIND_FILE=wind_d2_from231.nc
const_1                Alexander  WIND_FILE=wind_c1.nc
diurnal_1              Alexander  WIND_FILE=wind_d1.nc
meander_const_1        Meander    WIND_FILE=wind_c1_from231.nc
meander_diurnal_1      Meander    WIND_FILE=wind_d1_from231.nc
nomeander_const_1      NoMeander  WIND_FILE=wind_c1_from231.nc
nomeander_diurnal_1    NoMeander  WIND_FILE=wind_d1_from231.nc
none                   Alexander  EXEC=micro_estuary_my25_serial_dyes
meander_none           Meander    EXEC=micro_estuary_my25_serial_dyes
nomeander_none         NoMeander  EXEC=micro_estuary_my25_serial_dyes
e1_static              Alexander  EXEC=micro_estuary_my25_serial_dyes RIVERS=off
e1_wind                Alexander  WIND_FILE=wind_c2.nc RIVERS=off
e1_aks1e7              Alexander  WIND_FILE=wind_c2.nc AKS_BAK=1e-7 AKT_BAK=1e-7
e1_aks1e6              Alexander  WIND_FILE=wind_c2.nc AKS_BAK=1e-6 AKT_BAK=1e-6
