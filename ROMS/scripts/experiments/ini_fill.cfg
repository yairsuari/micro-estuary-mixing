# Fill spin-up for the closed mouth: from the prescribed
# fields (ini_raw.nc, estuary level 0, below the crest at +0.10 m), river x1 (20 000 m3/day), no wind,
# sea level 0, 2 days, hourly history. The river fills the estuary until it spills over the crest at the
# river rate (~1.4 days); that record becomes the initial condition of every run:
#   python ROMS/python/ini_from_run.py --runs-dir .../ROMS_runs/ini_fill --day <day>   (ROMS_DATA=Data_bar)
EXPERIMENT=ini_fill
PARALLEL=3
COMMON DATA=Data_bar INI_FILE=ini_raw.nc DAYS=2 HIS_HOURS=1 AVG_HOURS=24 DIA_HOURS=24 RIVERS=on EXEC=micro_estuary_my25_serial_dyes AKS_BAK=1e-8 AKT_BAK=1e-8 AKV_BAK=1e-6

alexander      Alexander
meander        Meander
nomeander      NoMeander
