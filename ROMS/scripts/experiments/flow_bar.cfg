# E3 (river flow) on the closed mouth (Data_bar), from the filled estuary (ini.nc of experiments/ini_fill.cfg):
# river x0.25 ... x128 of 20 000 m3/day and no river, three domains, no wind, sea level 0, 30 days, hourly
# history (hourly averages for x8 and up).
# x32, x64, x128: 4 days, since the pool is gone within a day at these flows.
EXPERIMENT=flow_bar
PARALLEL=12
COMMON DATA=Data_bar DAYS=30 HIS_HOURS=1 AVG_HOURS=24 DIA_HOURS=24 RIVERS=on AKS_BAK=1e-8 AKT_BAK=1e-8 AKV_BAK=1e-6 EXEC=micro_estuary_my25_serial_dyes

alex_q128        Alexander  RIVER_SCALE=128 AVG_HOURS=1 DAYS=4
meander_q128     Meander    RIVER_SCALE=128 AVG_HOURS=1 DAYS=4
nomeander_q128   NoMeander  RIVER_SCALE=128 AVG_HOURS=1 DAYS=4
