# Rerun of the 6 flow_bar runs that blew up (NaN) on the synthetic domains, with half the time step (DT = 1 s,
# NDTFAST = 11, so DTFAST = 0.09 s; the synthetic domains ran at 94-97% of their barotropic limit with DT = 2 s).
# Otherwise as flow_bar.cfg.
EXPERIMENT=flow_bar_fix
PARALLEL=6
COMMON DATA=Data_bar DAYS=30 HIS_HOURS=1 AVG_HOURS=24 DIA_HOURS=24 RIVERS=on AKS_BAK=1e-8 AKT_BAK=1e-8 AKV_BAK=1e-6 EXEC=micro_estuary_my25_serial_dyes DT=1 NDTFAST=11

meander_q16      Meander    RIVER_SCALE=16 AVG_HOURS=1
nomeander_q16    NoMeander  RIVER_SCALE=16 AVG_HOURS=1
meander_q8       Meander    RIVER_SCALE=8 AVG_HOURS=1
nomeander_q8     NoMeander  RIVER_SCALE=8 AVG_HOURS=1
nomeander_q4     NoMeander  RIVER_SCALE=4
nomeander_q2     NoMeander  RIVER_SCALE=2
